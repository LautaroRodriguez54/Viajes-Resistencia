services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: viajes
      POSTGRES_USER: viajes
      POSTGRES_PASSWORD: viajes
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viajes -d viajes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

