services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: viajes
      POSTGRES_USER: viajes
      POSTGRES_PASSWORD: viajes
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viajes -d viajes"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API en contenedor (opcional, para TP1/entrega containerizada). No arranca con `docker compose up -d`:
  #   docker compose --profile api up -d --build
  api:
    build: .
    image: viajes-resistencia-api:0.12.0
    profiles: ["api"]
    env_file:
      - .env
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://viajes_app:viajes_app_dev@postgres:5432/viajes
      BILLETERA_DATABASE_URL: postgres://billetera_app:billetera_app_dev@postgres:5432/billetera
      LECTURA_DATABASE_URL: postgres://lectura_app:lectura_app_dev@postgres:5432/lectura
      ADMIN_DATABASE_URL: postgres://viajes:viajes@postgres:5432/postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Visualización del contrato (docs/openapi.yaml). No arranca con el compose de siempre:
  #   docker compose --profile docs up -d docs   →  http://localhost:8080
  docs:
    image: swaggerapi/swagger-ui:v5.17.14
    profiles: ["docs"]
    environment:
      SWAGGER_JSON: /contrato/openapi.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./docs/openapi.yaml:/contrato/openapi.yaml:ro

volumes:
  postgres_data:

