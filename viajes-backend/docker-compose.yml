services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: viajes
      POSTGRES_USER: viajes
      POSTGRES_PASSWORD: viajes
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viajes -d viajes"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Visualización del contrato (docs/openapi.yaml). No arranca con el compose de siempre:
  #   docker compose --profile docs up -d docs   →  http://localhost:8080
  docs:
    image: swaggerapi/swagger-ui:v5.17.14
    profiles: ["docs"]
    environment:
      SWAGGER_JSON: /contrato/openapi.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./docs/openapi.yaml:/contrato/openapi.yaml:ro

volumes:
  postgres_data:

