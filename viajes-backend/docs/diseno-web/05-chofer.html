<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Chofer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F0EB}
a{color:#3346D3}a:hover{color:#1F2E9E}
</style>
</helmet>
<div style="font-family: Outfit, system-ui, sans-serif; font-size: 15px; color: #1C1B19; background: #F2F0EB; min-height: 800px; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">
  <header style="background: #FFFFFF; border-bottom: 1px solid #E4E0D8; box-sizing: border-box; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
    <span style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px"><span style="width: 12px; height: 12px; border-radius: 50%; background: #3346D3"></span>Viajes Resistencia</span>
    <span style="font-size: 14px; color: #67635C">Chofer · AE 123 KD · <a href="Login.dc.html">Salir</a></span>
  </header>

  <main style="flex: 1; position: relative; min-height: 720px; overflow: hidden; background: #F1F3F4">
    <svg viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" style="position: absolute; inset: 0; display: block" role="img" aria-label="Vista previa del viaje ofrecido: tu posición, el punto de retiro en la Plaza 25 de Mayo y el destino en la Terminal">
      <rect width="1280" height="800" fill="#F1F3F4"></rect>
      <rect x="566" y="296" width="138" height="108" rx="4" fill="#C8E6C9"></rect>
      <rect x="1080" y="440" width="150" height="90" rx="6" fill="#C8E6C9"></rect>
      <path d="M0 50 H1280 M0 170 H1280 M0 290 H1280 M0 530 H1280 M0 650 H1280 M0 770 H1280 M80 0 V800 M200 0 V800 M320 0 V800 M440 0 V800 M560 0 V800 M710 0 V800 M950 0 V800 M1070 0 V800 M1190 0 V800" stroke="#FFFFFF" stroke-width="9" fill="none"></path>
      <path d="M0 410 H1280 M830 0 V800 M710 290 L1050 -50 M560 410 L130 840" stroke="#DADCE0" stroke-width="20" fill="none"></path>
      <path d="M0 410 H1280 M830 0 V800 M710 290 L1050 -50 M560 410 L130 840" stroke="#FFFFFF" stroke-width="15" fill="none"></path>
      <path d="M1290 300 L1110 140 L960 -20" stroke="#F2C94C" stroke-width="20" fill="none"></path>
      <path d="M1290 300 L1110 140 L960 -20" stroke="#FDE293" stroke-width="15" fill="none"></path>
      <path d="M700 820 C 780 720, 930 700, 1020 640 S 1190 560, 1300 590 L 1300 820 Z" fill="#AADAFF"></path>
      <g font-family="Outfit, Arial, sans-serif" font-size="13" fill="#5F6368">
        <text x="190" y="402">Av. 9 de Julio</text>
        <text x="300" y="664" transform="rotate(-45 300 664)">Av. Alberdi</text>
        <text x="880" y="114" transform="rotate(-45 880 114)">Av. Sarmiento</text>
      </g>
      <text x="574" y="395" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E6B34">Plaza 25 de Mayo</text>
      <text x="1092" y="490" font-family="Outfit, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E6B34">Parque 2 de Febrero</text>
      <text x="960" y="748" font-family="Outfit, Arial, sans-serif" font-size="14" font-style="italic" fill="#2B6CB0">Río Negro</text>
      <path d="M440 530 V410 H710 V350" stroke="#202124" stroke-width="5" stroke-dasharray="1 11" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M710 350 V410 H830 V170 H1070" stroke="#1557B0" stroke-width="11" fill="none" stroke-linejoin="round" stroke-linecap="round"></path>
      <path d="M710 350 V410 H830 V170 H1070" stroke="#1A73E8" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"></path>
      <circle cx="710" cy="350" r="9" fill="#FFFFFF" stroke="#202124" stroke-width="5"></circle>
      <g transform="translate(724 318)"><rect width="64" height="26" rx="13" fill="#202124"></rect><text x="32" y="18" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Retiro</text></g>
      <g transform="translate(1070 170)"><path d="M0 0 C 0 0 -16 -18 -16 -30 A 16 16 0 0 1 16 -30 C 16 -18 0 0 0 0 Z" fill="#EA4335" stroke="#B31412" stroke-width="1.5"></path><circle cx="0" cy="-30" r="6" fill="#B31412"></circle></g>
      <g transform="translate(1086 178)"><rect width="74" height="26" rx="13" fill="#EA4335"></rect><text x="37" y="18" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Destino</text></g>
      <g transform="translate(440 530)"><circle r="26" fill="#1A73E8" opacity="0.18"></circle><circle r="13" fill="#1A73E8" stroke="#FFFFFF" stroke-width="3"></circle><path d="M0 -6 L5 5 L0 2 L-5 5 Z" fill="#FFFFFF"></path></g>
      <text x="474" y="560" font-family="Outfit, Arial, sans-serif" font-size="13" font-weight="600" fill="#1557B0">Vos</text>
    </svg>

    <section role="alertdialog" aria-labelledby="oferta-t" aria-describedby="oferta-d" style="position: absolute; left: 50%; top: 20px; transform: translateX(-50%); width: min(440px, calc(100% - 32px)); box-sizing: border-box; background: #FFFFFF; border-radius: 18px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(32,33,36,0.22); display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #67635C">
        <span style="width: 20px; height: 20px; border-radius: 6px; background: #3346D3; display: flex; align-items: center; justify-content: center"><span style="width: 7px; height: 7px; border-radius: 50%; background: #FFFFFF"></span></span>
        <span style="flex: 1">Viajes Resistencia · ahora</span>
        <span style="font-weight: 600; color: {{colorReloj}}">{{segundos}} s</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
        <h1 id="oferta-t" style="margin: 0; font-size: 19px; font-weight: 600">Nuevo viaje</h1>
        <span style="font-size: 22px; font-weight: 600">$ 20,50</span>
      </div>
      <p id="oferta-d" style="margin: 0; line-height: 1.45">Plaza 25 de Mayo → Terminal de Ómnibus<br><span style="font-size: 14px; color: #67635C">Retiro a 1,2 km (4 min) · viaje de 3,4 km (7 min)</span></p>
      <div style="height: 4px; background: #EEEBE5; border-radius: 999px"><div style="height: 4px; width: {{barra}}; background: {{colorReloj}}; border-radius: 999px"></div></div>
      <sc-if value="{{mostrarCarrera}}" hint-placeholder-val="{{ false }}">
        <p role="alert" style="margin: 0; font-size: 14px; color: #B42318; background: #FCE9E7; border-radius: 12px; padding: 10px 14px">Otro chofer lo aceptó primero.</p>
      </sc-if>
      <div style="display: flex; gap: 10px">
        <button type="button" style="flex: 1; height: 46px; border: 1px solid #D6D1C7; border-radius: 12px; background: #FFFFFF; color: #1C1B19; font: inherit; font-weight: 600; cursor: pointer">Rechazar</button>
        <button type="button" style="flex: 2; height: 46px; border: 0; border-radius: 12px; background: #3346D3; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Aceptar</button>
      </div>
    </section>

    <div style="position: absolute; left: 20px; bottom: 20px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 999px; padding: 8px 8px 8px 16px; box-shadow: 0 2px 8px rgba(32,33,36,0.2)">
      <span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-weight: 600">Disponible</span><span style="font-size: 12px; color: #67635C">enviando ubicación</span></span>
      <button type="button" role="switch" aria-checked="true" aria-label="Disponible para recibir viajes" style="width: 52px; height: 30px; border: 0; border-radius: 999px; background: #1F7A4D; padding: 4px; display: flex; justify-content: flex-end; cursor: pointer"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></button>
    </div>

    <div style="position: absolute; right: 20px; bottom: 20px; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 10px; box-shadow: 0 2px 8px rgba(32,33,36,0.2); overflow: hidden">
      <button type="button" aria-label="Acercar" style="width: 44px; height: 44px; border: 0; border-bottom: 1px solid #E8EAED; background: #FFFFFF; font: inherit; font-size: 22px; color: #3C4043; cursor: pointer">+</button>
      <button type="button" aria-label="Alejar" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; font: inherit; font-size: 22px; color: #3C4043; cursor: pointer">−</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"segundos":{"editor":"range","default":18,"min":0,"max":30,"step":1,"unit":"s"},"mostrarCarrera":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.segundos ?? 18;
    return {
      segundos: s,
      barra: Math.round((s / 30) * 100) + '%',
      colorReloj: s <= 5 ? '#B42318' : '#3346D3',
      mostrarCarrera: this.props.mostrarCarrera ?? false
    };
  }
}
</script>
</body>
</html>
